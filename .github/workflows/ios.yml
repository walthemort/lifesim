name: iPhone simulator build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - run: npm run ios:check
      - name: Build unsigned iPhone simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/lifesim-ios-build CODE_SIGNING_ALLOWED=NO build
